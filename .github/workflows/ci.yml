name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'
  AXA_KEEP_THEMES: 'true'

jobs:
  ci:
    name: CI (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        theme: [client, prospect, distributeur]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le postinstall applique le thème via --theme (le marqueur .initialized doit rester vide).
      - name: Install (${{ matrix.theme }})
        run: npm ci --theme=${{ matrix.theme }}

      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E
        run: npm run e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.theme }}
          path: playwright-report/
          retention-days: 7

  ci-ok:
    name: CI OK
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: test "${{ needs.ci.result }}" = "success"
