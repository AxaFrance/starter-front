# Required properties
sonar.projectKey=xxxx
sonar.projectName=Your Project Name

# ProjectVersion key can be set on maven job to get current project version
# sonar.projectVersion=${PROJECT_VERSION}

sonar.sourceEncoding=UTF-8

sonar.sources=index.html,src,mocks,config,themes
sonar.tests=src,e2e,themes

# Keep unit and E2E tests out of source analysis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/test-results/**,\
public/mockServiceWorker.js,\
src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/__tests__/**,\
themes/**/e2e/**,themes/**/__tests__/**

# Vitest unit tests and Playwright specs, including reusable theme templates.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/__tests__/**/*.ts,src/**/__tests__/**/*.tsx,\
e2e/**/*.ts,e2e/**/*.tsx,themes/**/e2e/**/*.ts,themes/**/e2e/**/*.tsx,\
themes/**/__tests__/**/*.ts,themes/**/__tests__/**/*.tsx


sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Templates, test infrastructure and generated files are not covered by Vitest.
sonar.coverage.exclusions=themes/**,e2e/**,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/__tests__/**,\
**/*.stories.ts,**/*.stories.tsx,**/*.mock.ts,**/*.mock.utils.ts,\
config/setupTest.ts,mocks/**,public/mockServiceWorker.js
