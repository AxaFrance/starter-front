<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>starter</title>
  </head>
  <body>
    <script>
      // Restaure le chemin transmis par le 404.html de GitHub Pages.
      (function () {
        var p = new URLSearchParams(location.search).get('p');
        if (p !== null) {
          history.replaceState(null, '', location.pathname + p.replace(/^\/+/, '') + location.hash);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
